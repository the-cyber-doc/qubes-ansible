---
- hosts: "templatevms"
  connection: qubes
  gather_facts: false
  # pre_tasks, not tasks: roles run before tasks and need ansible_os_family
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - role: common
    - role: base_packages
    - role: type_clipboard
    - role: shell
  tasks:
    # qubes-run-terminal (the "Run Terminal" menu entry) tries x-terminal-emulator
    # first; Fedora has no such alternative, so it is created there
    - name: Make Terminator the default terminal
      community.general.alternatives:
        name: x-terminal-emulator
        link: /usr/bin/x-terminal-emulator
        path: /usr/bin/terminator
        priority: 60
      become: yes
      when: ansible_os_family in ['Debian', 'RedHat']

# AppVMs/DVMs (and standalones) already have a home, so /etc/skel changes never
# reach them: the shell role copies the dotfiles into the home directly.
# Named DispVMs are not targeted: their home comes from their DVM.
- hosts: "appvms:standalonevms:!windows_vms"
  connection: qubes
  gather_facts: false
  # pre_tasks, not tasks: roles run before tasks and need ansible_os_family
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - role: common
    - role: shell

- hosts: local
  connection: local
  vars_files:
    - vars/base.yml
  tasks:
    - include_role:
        name: set_prefs
        apply:
          tags: [prefs, base]
      tags: [prefs]
      vars:
        target_vm: "{{ item }}"
        vm_qrexec_timeout: "{{ qrexec_timeout_default }}"
      loop: "{{ groups['appvms'] + groups['templatevms'] + groups['standalonevms'] + groups['windows_vms'] + groups['disp_vms']}}"

    - include_role:
        name: set_prefs
        apply:
          tags: [prefs, base]
      tags: [prefs]
      vars:
        target_vm: "{{ item.vm }}"
        vm_maxmem: "{{ item.maxmem | default('') }}"
        vm_memory: "{{ item.memory | default('') }}"
        vm_vcpus: "{{ item.vcpus | default('') }}"
      loop: "{{ vm_resource_config }}"

    - include_role:
        name: appsmenu_add
        apply:
          tags: [appsmenu, base]
      tags: [appsmenu]
      vars:
        appsmenu_add_target_vm: "{{ item }}"
        appsmenu_add_applications: "{{ base_appsmenu_applications }}"
      loop: "{{ (groups['appvms'] + groups['templatevms'] + groups['standalonevms'] + groups['disp_vms']) | difference(groups['windows_vms']) }}"

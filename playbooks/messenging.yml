---
#
# Template
#
- hosts: local
  connection: local
  vars_files:
    - vars/messenging.yml
  tasks:
    - include_tasks: tasks/clone_template.yml
      vars:
        clone_src: "{{ messenging_base_template }}"
        clone_dest: "{{ host_messenging_template }}"

- hosts: "{{ host_messenging_template }}"
  become: yes
  connection: qubes
  vars_files:
    - vars/messenging.yml
  roles:
    - role: common
    - role: base_packages
  tasks:
    - name: Install gnupg and SNAP
      ansible.builtin.include_role:
        name: common
        tasks_from: packages
      vars:
        packages_update_cache: true
        packages_upgrade: true
        packages_debian: "{{ messenging_packages_debian }}"
    - name: Download Signal signing key
      ansible.builtin.get_url:
        url: "{{ messenging_signal_key_url }}"
        dest: /tmp/signal-desktop-keys.asc
        mode: "0644"
    - name: Install Signal signing key
      ansible.builtin.command:
        cmd: "gpg --dearmor --yes -o {{ messenging_signal_keyring }} /tmp/signal-desktop-keys.asc"
        creates: "{{ messenging_signal_keyring }}"
    - name: Add Signal repository
      ansible.builtin.get_url:
        url: "{{ messenging_signal_sources_url }}"
        dest: /etc/apt/sources.list.d/signal-desktop.sources
        mode: "0644"
    - name: Download Google Chrome signing key
      ansible.builtin.get_url:
        url: "{{ messenging_chrome_key_url }}"
        dest: /tmp/google-chrome-key.asc
        mode: "0644"
    - name: Install Google Chrome signing key
      ansible.builtin.command:
        cmd: "gpg --dearmor --yes -o {{ messenging_chrome_keyring }} /tmp/google-chrome-key.asc"
        creates: "{{ messenging_chrome_keyring }}"
    - name: Add Google Chrome repository
      ansible.builtin.copy:
        content: "deb [arch=amd64 signed-by={{ messenging_chrome_keyring }}] https://dl.google.com/linux/chrome/deb/ stable main\n"
        dest: /etc/apt/sources.list.d/google-chrome.list
        mode: "0644"
    - name: Install Signal and Chrome (used for Teams)
      ansible.builtin.include_role:
        name: common
        tasks_from: packages
      vars:
        packages_update_cache: true
        packages_debian: "{{ messenging_repo_packages_debian }}"

- hosts: local
  connection: local
  vars_files:
    - vars/messenging.yml
  tasks:
    - name: Shutdown the messenging template
      qubesos:
        guest: "{{ host_messenging_template }}"
        state: shutdown
    - name: Remove the network
      ansible.builtin.command: qvm-prefs {{ host_messenging_template }} netvm ''

#
# AppVM
#
- hosts: local
  connection: local
  vars_files:
    - vars/messenging.yml
  tasks:
    - name: Check if VM exists
      shell: "qvm-ls --raw-data --fields name | grep -w '{{ host_messenging_vm }}$'"
      register: messenging_vm_check
      failed_when: false
      changed_when: false
    - name: Create VM
      command: qvm-create --class AppVM --label blue --template {{ host_messenging_template }} {{ host_messenging_vm }}
      when: messenging_vm_check.rc != 0
    - name: Set VM label
      command: qvm-prefs {{ host_messenging_vm }} label blue
    - name: Set VM network
      command: qvm-prefs {{ host_messenging_vm }} netvm {{ netvm_default }}
    - include_role:
        name: set_prefs
        apply:
          tags: [prefs, messenging]
      tags: [prefs]
      vars:
        target_vm: "{{ host_messenging_vm }}"
        vm_qrexec_timeout: "{{ qrexec_timeout_default }}"
        vm_private_storage: "{{ messenging_private_storage if messenging_vm_check.rc != 0 else '' }}"

- hosts: "{{ host_messenging_vm }}"
  connection: qubes
  vars_files:
    - vars/messenging.yml
  tasks:
    - name: Wait for snapd to finish seeding
      ansible.builtin.command: snap wait system seed.loaded
      changed_when: false
    - name: Install Snap Whatsie
      community.general.snap:
        name: whatsie
        state: present
    - name: Make sure autostart folder exists
      ansible.builtin.file:
        path: "/rw/home/user/.config/autostart"
        state: directory
        mode: 0755
    - name: Create autostart Signal symlink
      ansible.builtin.file:
        src: "/usr/share/applications/signal-desktop.desktop"
        dest: "/rw/home/user/.config/autostart/signal.desktop"
        state: link
    - name: Create autostart Whatsie symlink
      ansible.builtin.file:
        src: "/var/lib/snapd/desktop/applications/whatsie_whatsie.desktop"
        dest: "/rw/home/user/.config/autostart/whatsie.desktop"
        state: link
    - name: Create autostart Google Chrome symlink
      ansible.builtin.file:
        src: "/usr/share/applications/google-chrome.desktop"
        dest: "/rw/home/user/.config/autostart/google-chrome.desktop"
        state: link

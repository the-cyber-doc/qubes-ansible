---
#
# Template
#
- hosts: local
  connection: local
  vars_files:
    - vars/open-with.yml
  tasks:
    - include_tasks: tasks/clone_template.yml
      vars:
        clone_src: "{{ open-with_base_template }}"
        clone_dest: "{{ host_open-with_template }}"

- hosts: "{{ host_open-with_template | default([]) }}"
  become: yes
  connection: qubes
  vars_files:
    - vars/open-with.yml
  roles:
    - role: common
    - role: base_packages
    - role: open-with_template

- hosts: local
  connection: local
  vars_files:
    - vars/open-with.yml
  tasks:
    - name: Shutdown the OPEN-WITH Template
      qubesos:
        guest: "{{ host_open-with_template }}"
        state: shutdown
    - name: Remove the network
      command: qvm-prefs {{ host_open-with_template }} netvm ''

#
# DVM
#
- hosts: local
  connection: local
  vars_files:
    - vars/open-with.yml
  tasks:
    - name: Check if DVM exists
      shell: "qvm-ls --raw-data --fields name | grep -w {{ host_open-with_dvm }}"
      register: open-with_dvm_check
      failed_when: false
      changed_when: false
    - name: Create DVM
      command: qvm-create --class AppVM --label blue --template {{ host_open-with_template }} {{ host_open-with_dvm }}
      when: open-with_dvm_check.rc != 0
    - name: Set DVM label
      command: qvm-prefs {{ host_open-with_dvm }} label blue
    - name: Set DVM network
      command: qvm-prefs {{ host_open-with_dvm }} netvm {{ netvm_default }}
    - name: Set as DispVM template
      command: qvm-prefs {{ host_open-with_dvm }} template_for_dispvms true
    - name: Resize private volume
      command: qvm-volume resize {{ host_open-with_dvm }}:private 100GB
      when: open-with_dvm_check.rc != 0
    - include_role:
        name: set_prefs
        apply:
          tags: [prefs, open-with]
      tags: [prefs]
      vars:
        target_vm: "{{ host_open-with_dvm }}"
        vm_qrexec_timeout: "{{ qrexec_timeout_default }}"

- hosts: "{{ host_open-with_dvm | default([]) }}"
  become: yes
  connection: qubes
  vars_files:
    - vars/open-with.yml
  roles:
    - role: common
    - role: open-with_dvm_1

- hosts: local
  connection: local
  vars_files:
    - vars/open-with.yml
  tasks:
    - name: Shutdown the OPEN-WITH DVM
      qubesos:
        guest: "{{ host_open-with_dvm }}"
        state: shutdown

- hosts: local
  connection: local
  vars_files:
    - vars/open-with.yml
  tasks:
    - name: Start the OPEN-WITH DVM
      qubesos:
        guest: "{{ host_open-with_dvm }}"
        state: running

- hosts: "{{ host_open-with_dvm | default([]) }}"
  become: yes
  connection: qubes
  vars_files:
    - vars/open-with.yml
  roles:
    - role: common
    - role: open-with_dvm_2

- hosts: local
  connection: local
  vars_files:
    - vars/open-with.yml
  tasks:
    - name: Shutdown the OPEN-WITH DVM
      qubesos:
        guest: "{{ host_open-with_dvm }}"
        state: shutdown

#
# DispVM
#
- hosts: local
  connection: local
  vars_files:
    - vars/open-with.yml
    - vars/sys_gpu.yml
  tasks:
    - name: Check if DispVM exists
      shell: "qvm-ls --raw-data --fields name | grep -w {{ open-with_dispvm }}"
      register: open-with_dispvm_check
      failed_when: false
      changed_when: false
    - name: Create DispVM
      command: qvm-create --class DispVM --label red --template {{ host_open-with_dvm }} {{ open-with_dispvm }}
      when: open-with_dispvm_check.rc != 0
    - name: Set default DVM
      command: qvm-prefs {{ open-with_dispvm }} default_dispvm {{ host_open-with_dvm }}
    - name: Set label
      command: qvm-prefs {{ open-with_dispvm }} label red
    - name: Set HVM mode
      command: qvm-prefs {{ open-with_dispvm }} virt_mode hvm
    - name: Set network
      command: qvm-prefs {{ open-with_dispvm }} netvm {{ netvm_default }}
    - include_role:
        name: set_prefs
        apply:
          tags: [prefs, open-with]
      tags: [prefs]
      vars:
        target_vm: "{{ open-with_dispvm }}"
        vm_qrexec_timeout: "{{ qrexec_timeout_default }}"
        vm_vcpus: "{{ open-with_vcpus }}"
        vm_maxmem: "{{ open-with_maxmem }}"

---
# Builds the same Template -> DVM -> DispVM chain for Debian and Fedora; each
# Dom0 play loops over open_with_builds, each in-VM play targets both VMs.

#
# Template
#
- hosts: local
  connection: local
  vars_files:
    - vars/open_with.yml
  tasks:
    - include_tasks: tasks/clone_template.yml
      loop: "{{ open_with_builds }}"
      loop_control:
        label: "{{ item.template }}"
      vars:
        clone_src: "{{ item.base_template }}"
        clone_dest: "{{ item.template }}"

- hosts: "{{ [host_open_with_template_debian | default(''), host_open_with_template_fedora | default('')] | select | list }}"
  become: yes
  connection: qubes
  vars_files:
    - vars/open_with.yml
  roles:
    - role: common
    - role: shell
    - role: base_packages
    - role: firefox
    - role: type_clipboard

- hosts: local
  connection: local
  vars_files:
    - vars/open_with.yml
  tasks:
    - name: Shutdown the Open-with Templates
      qubesos:
        guest: "{{ item.template }}"
        state: shutdown
      loop: "{{ open_with_builds }}"
      loop_control:
        label: "{{ item.template }}"
    - name: Remove the network
      ansible.builtin.command: qvm-prefs {{ item.template }} netvm ''
      loop: "{{ open_with_builds }}"
      loop_control:
        label: "{{ item.template }}"

#
# DVM
#
- hosts: local
  connection: local
  vars_files:
    - vars/open_with.yml
  tasks:
    - name: Check if DVM exists
      ansible.builtin.shell: "qvm-ls --raw-data --fields name | grep -w '{{ item.dvm }}$'"
      register: open_with_dvm_check
      failed_when: false
      changed_when: false
      loop: "{{ open_with_builds }}"
      loop_control:
        label: "{{ item.dvm }}"
    - name: Create DVM
      ansible.builtin.command: qvm-create --class AppVM --label {{ open_with_label }} --template {{ item.item.template }} {{ item.item.dvm }}
      when: item.rc != 0
      loop: "{{ open_with_dvm_check.results }}"
      loop_control:
        label: "{{ item.item.dvm }}"
    - name: Set DVM label
      ansible.builtin.command: qvm-prefs {{ item.dvm }} label {{ open_with_label }}
      loop: "{{ open_with_builds }}"
      loop_control:
        label: "{{ item.dvm }}"
    - name: Set DVM network
      ansible.builtin.command: qvm-prefs {{ item.dvm }} netvm {{ netvm_default }}
      loop: "{{ open_with_builds }}"
      loop_control:
        label: "{{ item.dvm }}"
    - name: Set as DispVM template
      ansible.builtin.command: qvm-prefs {{ item.dvm }} template_for_dispvms true
      loop: "{{ open_with_builds }}"
      loop_control:
        label: "{{ item.dvm }}"
    - name: Add the DVM to the App menu
      ansible.builtin.command: qvm-features {{ item.dvm }} appmenus-dispvm 1
      loop: "{{ open_with_builds }}"
      loop_control:
        label: "{{ item.dvm }}"
    - include_role:
        name: set_prefs
        apply:
          tags: [prefs, open-with]
      tags: [prefs]
      loop: "{{ open_with_builds }}"
      loop_control:
        label: "{{ item.dvm }}"
      vars:
        target_vm: "{{ item.dvm }}"
        vm_qrexec_timeout: "{{ qrexec_timeout_default }}"
    - include_role:
        name: appsmenu_add
      loop: "{{ open_with_builds }}"
      loop_control:
        label: "{{ item.dvm }}"
      vars:
        appsmenu_add_target_vm: "{{ item.dvm }}"
        appsmenu_add_applications: "{{ item.appsmenu }}"

- hosts: "{{ [host_open_with_dvm_debian | default(''), host_open_with_dvm_fedora | default('')] | select | list }}"
  become: yes
  connection: qubes
  vars_files:
    - vars/open_with.yml
  roles:
    - role: common
    - role: shell
    - role: xfce
    - role: type_clipboard

- hosts: local
  connection: local
  vars_files:
    - vars/open_with.yml
  tasks:
    - name: Shutdown the Open-with DVMs
      qubesos:
        guest: "{{ item.dvm }}"
        state: shutdown
      loop: "{{ open_with_builds }}"
      loop_control:
        label: "{{ item.dvm }}"

---
# Runs in the TemplateVM (selected by main.yml).
- name: Install additional packages
  ansible.builtin.include_role:
    name: common
    tasks_from: packages
  vars:
    packages_redhat: "{{ vpn_packages_redhat }}"
- name: Download Proton repository
  command:
    cmd: "curl -L -o /tmp/proton_repo.rpm {{ proton_vpn_repo_url }}"
- name: Install Proton repository
  ansible.builtin.command:
    cmd: dnf install -y /tmp/proton_repo.rpm
# proton-vpn-daemon's %posttrans ends with "systemctl start
# me.proton.vpn.split_tunneling.service", which fails in the template: dnf then
# reports an error on the first install although every package is installed.
# The rescue accepts that case and still fails if a package is really missing.
- name: Update packages and install Proton App
  block:
    - name: Install Proton App
      ansible.builtin.include_role:
        name: common
        tasks_from: packages
      vars:
        packages_upgrade: true
        packages_redhat: "{{ vpn_proton_packages_redhat }}"
  rescue:
    - name: Check the Proton App packages are installed despite the dnf error
      ansible.builtin.command:
        cmd: "rpm -q {{ vpn_proton_packages_redhat | join(' ') }}"
      changed_when: false
- name: Deploy dconf drop-in to enable AppIndicator extension
  ansible.builtin.copy:
    src: 00-appindicator
    dest: /etc/dconf/db/local.d/00-appindicator
    owner: root
    group: root
    mode: "0644"

---
# Runs in the AppVM/DVM (selected by main.yml).
- name: Ensure autostart directory exists
  ansible.builtin.file:
    path: "{{ vpn_autostart_dir }}"
    state: directory
    owner: "{{ vm_user }}"
    group: "{{ vm_group }}"
    mode: "0755"

- name: Link Proton VPN .desktop into autostart
  ansible.builtin.file:
    src: "{{ vpn_proton_desktop_file }}"
    dest: "{{ vpn_autostart_dir }}/{{ vpn_proton_desktop_file | basename }}"
    state: link
    owner: "{{ vm_user }}"
    group: "{{ vm_group }}"

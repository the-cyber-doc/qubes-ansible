---
- name: Install Firefox
  ansible.builtin.include_role:
    name: common
    tasks_from: packages
  vars:
    packages_debian: "{{ firefox_packages_debian }}"
    packages_redhat: "{{ firefox_packages_redhat }}"

# The install directory differs per distro: /usr/lib/firefox-esr (Debian),
# /usr/lib64/firefox (Fedora x86_64). policies.json is only read from the
# distribution directory of the actual install, so look for application.ini.
- name: Find Firefox install directory
  ansible.builtin.stat:
    path: "{{ item }}/application.ini"
  loop: "{{ firefox_install_dirs }}"
  register: _firefox_install_dir_stats

- name: Fail when no Firefox install directory exists
  ansible.builtin.fail:
    msg: "No Firefox install directory found among {{ firefox_install_dirs | join(', ') }}"
  when: _firefox_install_dir_stats.results | selectattr('stat.exists') | list | length == 0

- name: Set Firefox distribution path
  ansible.builtin.set_fact:
    firefox_dist_path: "{{ (_firefox_install_dir_stats.results | selectattr('stat.exists') | first).item }}/distribution"

- name: Create Firefox distribution directory
  ansible.builtin.file:
    path: "{{ firefox_dist_path }}"
    state: directory
    mode: '0755'
  become: yes

- name: Build extra extension install URL list
  ansible.builtin.set_fact:
    _firefox_extra_install_urls: >-
      {{
        firefox_extra_extensions
        | map('extract', firefox_available_extra_extensions)
        | map(attribute='install_url')
        | list
      }}

- name: Build Firefox policies document
  ansible.builtin.set_fact:
    _firefox_policies:
      policies:
        DontCheckDefaultBrowser: true
        OverrideFirstRunPage: ""
        OverridePostUpdatePage: ""
        DisableTelemetry: true
        Homepage:
          URL: "https://duckduckgo.com"
          Locked: false
          StartPage: "homepage"
        ExtensionSettings: "{{ firefox_base_extensions }}"
        Extensions:
          Install: "{{ _firefox_extra_install_urls }}"

- name: Add manual proxy policy
  ansible.builtin.set_fact:
    _firefox_policies:
      policies: "{{ _firefox_policies.policies | combine({'Proxy': {'Mode': 'manual', 'HTTPProxy': firefox_proxy, 'SSLProxy': firefox_proxy, 'UseHTTPProxyForAllProtocols': true, 'Locked': false}}) }}"
  when: firefox_proxy | length > 0

- name: Deploy Firefox policies
  ansible.builtin.copy:
    content: "{{ _firefox_policies | to_nice_json }}\n"
    dest: "{{ firefox_dist_path }}/policies.json"
    mode: '0644'
  become: yes

- name: Create Firefox skel profile directory
  ansible.builtin.file:
    path: /etc/skel/.mozilla/firefox/default
    state: directory
    mode: '0755'
  become: yes

- name: Deploy Firefox profiles.ini to skel
  ansible.builtin.copy:
    src: profiles.ini
    dest: /etc/skel/.mozilla/firefox/profiles.ini
    mode: '0644'
  become: yes

- name: Deploy Firefox user.js to skel profile
  ansible.builtin.copy:
    src: user.js
    dest: /etc/skel/.mozilla/firefox/default/user.js
    mode: '0644'
  become: yes

# The launcher name differs per distro: firefox-esr.desktop (Debian),
# org.mozilla.firefox.desktop (recent Fedora), firefox.desktop (older Fedora).
- name: Find Firefox desktop files
  ansible.builtin.find:
    paths: /usr/share/applications
    patterns:
      - firefox*.desktop
      - org.mozilla.firefox*.desktop
  register: _firefox_desktop_files

- name: Fail when no Firefox desktop file exists
  ansible.builtin.fail:
    msg: "No Firefox desktop file found in /usr/share/applications"
  when: _firefox_desktop_files.matched == 0

# Force every launcher (menu, actions) to open the configured profile, bypassing
# Firefox's per-install "dedicated profile" selection. Anchored on "Exec=" so the
# TryExec= line is untouched; the leading lookahead skips lines already carrying
# "-P" so the task is idempotent.
- name: Force Firefox launchers to use the configured profile
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '^Exec=(?!.* -P )(\S+)(.*)$'
    replace: 'Exec=\1 -P {{ firefox_profile_name }}\2'
  loop: "{{ _firefox_desktop_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  become: yes
